[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligrate"
version = "0.1.1"
description = "Diversity-aware sample subsetting and kNN-based extrapolation from one data matrix/layer to another across complete datasets."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Annina Meyer" },
]
keywords = [
  "microbiome",
  "metagenomics",
  "multi-omics",
  "inference",
  "sample-selection",
  "subsetting",
  "functional-profiling",
  "bioinformatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "deap",
  "matplotlib",
  "pyyaml",
  "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "tomli; python_version < '3.11'"]
kmedoids = ["scikit-learn-extra"]
maps = ["geopandas", "contextily"]

[project.scripts]
intelligrate = "intelligrate._cli:main"

[project.urls]
Repository = "https://github.com/anninameyer/Intelligrate"
Documentation = "https://github.com/anninameyer/Intelligrate#readme"
Issues = "https://github.com/anninameyer/Intelligrate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
