[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligrate"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "deap",
  "matplotlib",
  "pyyaml",
  "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]
kmedoids = ["scikit-learn-extra"]

[tool.setuptools.packages.find]
where = ["src"]
